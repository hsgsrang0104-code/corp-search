<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 AI 하이브리드 기업 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-md bg-blue-600 text-white rounded-xl p-4 shadow-md text-center mb-6">
        <h1 class="text-xl font-bold">🏢 실시간 AI 기업 검색</h1>
        <p class="text-xs text-blue-100 mt-1">포털/웹 탐색 + 국세청 실시간 검증</p>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl p-5 shadow-md mb-6 space-y-4">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">법인상호 / 기업명</label>
            <input type="text" id="corpNameInput" placeholder="예: 탑안전공사 또는 아무 기업이나 입력" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <button onclick="searchCompany()" id="searchBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow">
            실시간 AI 검색하기
        </button>
    </div>

    <div id="loading" class="hidden text-center py-6">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
        <p class="text-xs text-gray-500 mt-2">AI가 포털 및 외부 웹 데이터를 실시간 탐색 중입니다...</p>
    </div>

    <div id="resultContainer" class="w-full max-w-md bg-white rounded-xl p-5 shadow-md hidden border-l-4 border-blue-600">
        <div class="flex justify-between items-center mb-3 border-b pb-2">
            <h2 id="resCorpName" class="text-lg font-bold text-gray-800">정보 없음</h2>
            <span id="resStatusBadge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-700">상태확인중</span>
        </div>
        <div class="space-y-2.5 text-sm">
            <div class="flex justify-between">
                <span class="text-gray-500">대표자명</span>
                <span id="resCeo" class="font-medium text-gray-800">정보 없음</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">설립일</span>
                <span id="resDate" class="font-medium text-gray-800">정보 없음</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">사업자등록번호</span>
                <span id="resBizNo" class="font-medium text-gray-800">정보 없음</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">대표전화번호</span>
                <span id="resPhone" class="font-medium text-blue-600">정보 없음</span>
            </div>
            <div>
                <span class="text-gray-500 block mb-1">사업장 주소</span>
                <span id="resAddress" class="font-medium text-gray-800 text-xs bg-gray-50 p-2 rounded block leading-relaxed">정보 없음</span>
            </div>
        </div>
    </div>

    <script>
        async function searchCompany() {
            const rawCorpName = document.getElementById('corpNameInput').value.trim();
            if (!rawCorpName) {
                alert("기업명을 입력해 주세요.");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            try {
                // 백엔드 API 연동 호출
                const response = await fetch(`/api/search?corpName=${encodeURIComponent(rawCorpName)}`);
                const data = await response.json();

                document.getElementById('resCorpName').innerText = data.corpNm || rawCorpName;
                document.getElementById('resCeo').innerText = data.ceoNm || "정보 없음";
                document.getElementById('resDate').innerText = data.foundDate || "정보 없음";
                document.getElementById('resBizNo').innerText = data.bizno || "정보 없음";
                document.getElementById('resPhone').innerText = data.phone || "정보 없음";
                document.getElementById('resAddress').innerText = data.address || "정보 없음";

                const badge = document.getElementById('resStatusBadge');
                badge.innerText = data.bizStatus || "조회 완료";
                badge.className = `px-2.5 py-1 text-xs font-semibold rounded-full ${data.bizStatus?.includes('폐업') ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;

                document.getElementById('resultContainer').classList.remove('hidden');
            } catch (e) {
                alert("조회 실패: AI 검색 서버 연결을 확인해 주세요.");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
