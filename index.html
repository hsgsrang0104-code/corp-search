<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 법인 정보 조회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- 상단 타이틀 영역 -->
    <div class="w-full max-w-md bg-blue-600 text-white rounded-xl p-4 shadow-md text-center mb-6">
        <h1 class="text-xl font-bold">🏢 모바일 법인 정보 조회</h1>
        <p class="text-xs text-blue-100 mt-1">공공데이터 실시간 연동 서비스</p>
    </div>

    <!-- 검색 입력 폼 -->
    <div class="w-full max-w-md bg-white rounded-xl p-5 shadow-md mb-6">
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-700 mb-1">법인상호 (필수)</label>
            <input type="text" id="corpNameInput" placeholder="예: 투어라운지" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <button onclick="searchCompany()" id="searchBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">
            조회하기
        </button>
    </div>

    <!-- 로딩 상태 표시 -->
    <div id="loading" class="hidden text-center py-6">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
        <p class="text-xs text-gray-500 mt-2">공공데이터 서버에서 정보를 조회하고 있습니다...</p>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="resultContainer" class="w-full max-w-md bg-white rounded-xl p-5 shadow-md hidden border-l-4 border-blue-600">
        <div class="flex justify-between items-center mb-3 border-b pb-2">
            <h2 id="resCorpName" class="text-lg font-bold text-gray-800">상호명</h2>
            <span id="resStatusBadge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-700">상태확인중</span>
        </div>
        <div class="space-y-2 text-sm">
            <div class="flex justify-between">
                <span class="text-gray-500">사업자등록번호</span>
                <span id="resBizNo" class="font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">법인등록번호</span>
                <span id="resCorpNo" class="font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">대표전화번호</span>
                <span id="resPhone" class="font-medium text-blue-600">-</span>
            </div>
            <div>
                <span class="text-gray-500 block mb-1">현재 주소</span>
                <span id="resAddress" class="font-medium text-gray-800 text-xs bg-gray-50 p-2 rounded block leading-relaxed">-</span>
            </div>
        </div>
    </div>

    <!-- 에러/안내 메시지 영역 -->
    <div id="errorContainer" class="w-full max-w-md bg-red-50 text-red-700 p-4 rounded-xl shadow-md hidden text-sm text-center">
        조회된 결과가 없거나 공공데이터 연동 중 오류가 발생했습니다. 정확한 상호명을 입력해 주세요.
    </div>

    <script>
        const API_KEY = "dbc8f97a8eb1093b6b8ec7a0c664e3d01f2a3a33720f2d373a7bf91314fb15";

        async function searchCompany() {
            const corpName = document.getElementById('corpNameInput').value.trim();
            if (!corpName) {
                alert("조회할 법인상호를 입력해주세요.");
                return;
            }

            // UI 초기화
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('errorContainer').classList.add('hidden');
            document.getElementById('searchBtn').disabled = true;

            try {
                // 1. 금융위원회 기업기본정보 API 호출 (법인명 검색)
                // 브라우저 CORS 우회를 위해 프록시 서버 경유 또는 표준 엔드포인트 호출
                const fscUrl = `https://apis.data.go.kr/1160100/service/GetCorpBasicInfoService_V2/getCorpBsInfo_V2?serviceKey=${API_KEY}&numOfRows=1&pageNo=1&resultType=json&corpNm=${encodeURIComponent(corpName)}`;
                
                // CORS 프록시 활용 (정적 웹 호스팅 환경 대응)
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(fscUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();

                const items = data?.response?.body?.items?.item;
                if (!items || items.length === 0) {
                    throw new Error("기업 정보를 찾을 수 없습니다.");
                }

                const company = Array.isArray(items) ? items[0] : items;
                
                const bizNo = company.bizno || "-";
                const corpNo = company.crno || "-";
                const address = company.enpRprFndnAddr || company.refineRoadnmAddr || "주소 정보 없음";
                const name = company.corpNm || corpName;
                
                // 전화번호가 없는 경우 보조 검색 결과 안내 (블로그/포털 검색 연동 영역)
                let phone = company.enpTlno || company.telNo || "전화번호 미공개 (포털 검색 보완 필요)";

                // 2. 국세청 사업자 상태조회 API 연동 (사업자번호가 있는 경우)
                let bizStatus = "계속사업자";
                let badgeClass = "bg-green-100 text-green-700";

                if (bizNo && bizNo !== "-") {
                    try {
                        const ntsUrl = `https://api.odcloud.kr/api/nts-businessman/v1/status?serviceKey=${API_KEY}`;
                        const ntsBody = { b_no: [bizNo.replace(/-/g, "")] };
                        
                        const ntsResponse = await fetch(ntsUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Accept": "application/json" },
                            body: JSON.stringify(ntsBody)
                        });
                        const ntsData = await ntsResponse.json();
                        if (ntsData && ntsData.data && ntsData.data.length > 0) {
                            const statusObj = ntsData.data[0];
                            bizStatus = statusObj.b_stt || "계속사업자";
                            if (bizStatus.includes("폐업")) {
                                badgeClass = "bg-red-100 text-red-700";
                            }
                        }
                    } catch (e) {
                        console.log("국세청 상태조회 스킵 또는 예외 발생", e);
                    }
                }

                // 결과 화면에 반영
                document.getElementById('resCorpName').innerText = name;
                document.getElementById('resBizNo').innerText = bizNo;
                document.getElementById('resCorpNo').innerText = corpNo;
                document.getElementById('resPhone').innerText = phone;
                document.getElementById('resAddress').innerText = address;

                const badge = document.getElementById('resStatusBadge');
                badge.innerText = bizStatus;
                badge.className = `px-2.5 py-1 text-xs font-semibold rounded-full ${badgeClass}`;

                document.getElementById('resultContainer').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('errorContainer').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
