
<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>기업 정보 조회 시스템</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 2px rgba(43,108,176,0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #4b6fb1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2c5282;
        }

        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #718096;
            margin-top: 20px;
            display: none;
            font-size: 15px;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px 25px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            border-bottom: 1px solid #edf2f7;
            padding: 13px 0;
        }

        .result-label {
            font-weight: bold;
            color: #718096;
            min-width: 125px;
        }

        .result-value {
            color: #2d3748;
            text-align: right;
            word-break: break-all;
        }

        .result-count {
            color: #718096;
            font-size: 13px;
            margin-top: 12px;
            text-align: right;
        }

        .error-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 7px;
            color: #c53030;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .help-text {
            color: #718096;
            font-size: 13px;
            margin-top: 6px;
        }

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .result-box {
                padding: 15px;
            }

            .result-label {
                min-width: 105px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h2>🏢 기업 정보 조회 시스템</h2>


    <!-- 상호명 입력 -->

    <div class="form-group">

        <label for="corpName">
            상호명 *필수
        </label>

        <input
            type="text"
            id="corpName"
            placeholder="예: 세진밀레니엄에이"
            autocomplete="organization"
        >

    </div>


    <!-- 소재지 입력 -->

    <div class="form-group">

        <label for="address">
            소재지 / 주소 (선택)
        </label>

        <input
            type="text"
            id="address"
            placeholder="예: 대전 서구"
        >

        <div class="help-text">
            동명 기업이 여러 곳일 경우 후보를 구분하는 데 활용합니다.
        </div>

    </div>


    <!-- 조회 버튼 -->

    <button
        id="searchButton"
        onclick="searchCorp()"
    >
        조회하기
    </button>


    <!-- 조회 중 -->

    <div class="loading" id="loading">
        기업 정보를 검색하고 있습니다...
    </div>


    <!-- 오류 메시지 -->

    <div
        class="error-message"
        id="errorMessage"
    ></div>


    <!-- 검색 결과 -->

    <div
        class="result-box"
        id="resultBox"
    >

        <div class="result-item">
            <span class="result-label">상호</span>
            <span class="result-value" id="res-corpName">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">대표자명</span>
            <span class="result-value" id="res-ceoNm">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">사업자등록번호</span>
            <span class="result-value" id="res-bizno">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">법인등록번호</span>
            <span class="result-value" id="res-crno">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">전화번호</span>
            <span class="result-value" id="res-phone">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">주소</span>
            <span class="result-value" id="res-address">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">사업자상태</span>
            <span class="result-value" id="res-status">조회 전</span>
        </div>

        <!-- 폐업일자는 폐업한 경우에만 표시 -->

        <div
            class="result-item"
            id="endDateRow"
            style="display:none;"
        >

            <span class="result-label">폐업일자</span>

            <span
                class="result-value"
                id="res-endDate"
            ></span>

        </div>

        <div
            class="result-count"
            id="resultCount"
        ></div>

    </div>

</div>


<script>

// =====================================
// 1. 기업정보 조회
// =====================================

async function searchCorp() {

    const corpName =
        document.getElementById('corpName').value.trim();

    const address =
        document.getElementById('address').value.trim();

    const loading =
        document.getElementById('loading');

    const resultBox =
        document.getElementById('resultBox');

    const errorMessage =
        document.getElementById('errorMessage');

    const searchButton =
        document.getElementById('searchButton');


    // 상호명 확인

    if (!corpName) {

        alert("상호명을 입력해 주세요.");

        document.getElementById('corpName').focus();

        return;

    }


    // 기존 결과 초기화

    resultBox.style.display = 'none';

    errorMessage.style.display = 'none';

    errorMessage.innerText = '';

    document.getElementById('endDateRow').style.display = 'none';


    // 로딩 시작

    loading.style.display = 'block';

    searchButton.disabled = true;

    searchButton.innerText = '조회 중...';


    try {

        // =====================================
        // 2. Vercel API 호출
        // =====================================

        const params = new URLSearchParams({

            corpName: corpName,

            address: address

        });

        const response = await fetch(
            `/api/search?${params.toString()}`
        );


        // =====================================
        // 3. 응답 데이터 확인
        // =====================================

        const data = await response.json();

        console.log("기업정보 조회 결과:", data);


        if (!response.ok || data.success === false) {

            throw new Error(
                data.error ||
                data.resultMsg ||
                "기업정보 조회에 실패했습니다."
            );

        }


        // =====================================
        // 4. 기본 기업정보 표시
        // =====================================

        document.getElementById('res-corpName').innerText =
            data.corpName || '정보없음';

        document.getElementById('res-ceoNm').innerText =
            data.ceoNm || '정보없음';

        // 하이픈이 적용된 번호를 그대로 표시

        document.getElementById('res-bizno').innerText =
            data.bizno || '정보없음';

        document.getElementById('res-crno').innerText =
            data.crno || '정보없음';

        document.getElementById('res-phone').innerText =
            data.phone || '정보없음';

        document.getElementById('res-address').innerText =
            data.address || '정보없음';


        // =====================================
        // 5. 국세청 사업자 상태 표시
        // =====================================

        document.getElementById('res-status').innerText =
            data.status || '조회 결과 없음';


        // 폐업일자 표시

        if (
            data.endDate &&
            data.status === '폐업자'
        ) {

            document.getElementById('res-endDate').innerText =
                data.endDate;

            document.getElementById('endDateRow').style.display =
                'flex';

        }


        // =====================================
        // 6. 조회 건수 표시
        // =====================================

        document.getElementById('resultCount').innerText =

            `전체 검색 결과 ${data.totalCount ?? 0}건 / ` +
            `반환 결과 ${data.returnedCount ?? 0}건`;


        // 결과 표시

        resultBox.style.display = 'block';


        // 국세청 조회 실패 시 상세 오류 확인

        if (data.ntsError) {

            console.warn(
                "국세청 상태조회 오류:",
                data.ntsError
            );

        }

    }


    // =====================================
    // 7. 오류 처리
    // =====================================

    catch (error) {

        console.error("조회 오류:", error);

        errorMessage.innerText =
            "조회 중 오류가 발생했습니다.\n\n" +
            error.message;

        errorMessage.style.display = 'block';

    }


    // =====================================
    // 8. 조회 완료
    // =====================================

    finally {

        loading.style.display = 'none';

        searchButton.disabled = false;

        searchButton.innerText = '조회하기';

    }

}


// =====================================
// 9. Enter 키로 검색
// =====================================

document.getElementById('corpName')
    .addEventListener('keydown', function(event) {

        if (event.key === 'Enter') {
            searchCorp();
        }

    });


document.getElementById('address')
    .addEventListener('keydown', function(event) {

        if (event.key === 'Enter') {
            searchCorp();
        }

    });

</script>

</body>

</html>
