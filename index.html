<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 하이브리드 법인 정보 조회</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <!-- 상단 타이틀 영역 -->
    <div class="w-full max-w-md bg-blue-600 text-white rounded-xl p-4 shadow-md text-center mb-6">
        <h1 class="text-xl font-bold">🏢 AI 하이브리드 기업 정보 조회</h1>
        <p class="text-xs text-blue-100 mt-1">AI 지능형 검색 + 국세청 실시간 대사</p>
    </div>

    <!-- 검색 입력 폼 -->
    <div class="w-full max-w-md bg-white rounded-xl p-5 shadow-md mb-6 space-y-4">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">법인상호 / 기업명 (필수)</label>
            <input type="text" id="corpNameInput" placeholder="예: (주)탑안전공사 또는 투어라운지" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">소재지 주소 (선택)</label>
            <input type="text" id="addressInput" placeholder="예: 대전광역시 서구 (선택사항)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <button onclick="searchCompany()" id="searchBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow">
            AI 스마트 조회하기
        </button>
    </div>

    <!-- 로딩 상태 표시 -->
    <div id="loading" class="hidden text-center py-6">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
        <p class="text-xs text-gray-500 mt-2">AI 엔진이 최신 데이터 교차 검증을 수행 중입니다...</p>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="resultContainer" class="w-full max-w-md bg-white rounded-xl p-5 shadow-md hidden border-l-4 border-blue-600">
        <div class="flex justify-between items-center mb-3 border-b pb-2">
            <h2 id="resCorpName" class="text-lg font-bold text-gray-800">정보 없음</h2>
            <span id="resStatusBadge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-700">상태확인중</span>
        </div>
        <div class="space-y-2.5 text-sm">
            <div class="flex justify-between">
                <span class="text-gray-500">대표자명</span>
                <span id="resCeo" class="font-medium text-gray-800">정보 없음</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">사업자등록번호</span>
                <span id="resBizNo" class="font-medium text-gray-800">정보 없음</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">법인등록번호</span>
                <span id="resCorpNo" class="font-medium text-gray-800">정보 없음</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500">대표전화번호</span>
                <span id="resPhone" class="font-medium text-blue-600">정보 없음</span>
            </div>
            <div>
                <span class="text-gray-500 block mb-1">소재지 주소</span>
                <span id="resAddress" class="font-medium text-gray-800 text-xs bg-gray-50 p-2 rounded block leading-relaxed">정보 없음</span>
            </div>
        </div>
    </div>

    <!-- 에러/안내 메시지 영역 -->
    <div id="errorContainer" class="w-full max-w-md bg-red-50 text-red-700 p-4 rounded-xl shadow-md hidden text-sm text-center">
        조회된 결과가 없습니다. 정확한 기업명이나 주소를 입력해 주세요.
    </div>

    <script>
        const API_KEY = "dbc8f97a8eb1093b6b8ec7a0c664e3d01f2a3a33720f2d373a7bf91314fb15";

        async function searchCompany() {
            const rawCorpName = document.getElementById('corpNameInput').value.trim();
            const addressQuery = document.getElementById('addressInput').value.trim();

            if (!rawCorpName && !addressQuery) {
                alert("법인상호 또는 소재지 주소 중 하나 이상을 입력해주세요.");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('errorContainer').classList.add('hidden');
            document.getElementById('searchBtn').disabled = true;

            try {
                const cleanInputName = rawCorpName.replace(/주식회사|\(주\)|\(유\)|\(합\)|\s+/g, "");

                // 1차: 공공데이터포털(금융위원회 기업기본정보 API) 실시간 호출
                let fscUrl = `https://apis.data.go.kr/1160100/service/GetCorpBasicInfoService_V2/getCorpBsInfo_V2?serviceKey=${API_KEY}&numOfRows=50&pageNo=1&resultType=json`;
                if (cleanInputName) {
                    fscUrl += `&corpNm=${encodeURIComponent(cleanInputName)}`;
                }

                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(fscUrl)}`;
                const response = await fetch(proxyUrl);
                const rawText = await response.text();

                let companyData = null;

                try {
                    const parsedData = JSON.parse(rawText);
                    let items = parsedData?.response?.body?.items?.item;
                    if (items) {
                        let companyList = Array.isArray(items) ? items : [items];
                        
                        if (cleanInputName) {
                            const filtered = companyList.filter(item => {
                                const dbName = (item.corpNm || "").replace(/주식회사|\(주\)|\(유\)|\(합\)|\s+/g, "");
                                return dbName.includes(cleanInputName);
                            });
                            if (filtered.length > 0) companyList = filtered;
                        }

                        if (addressQuery) {
                            const cleanAddr = addressQuery.replace(/\s+/g, "");
                            const filteredAddr = companyList.filter(item => {
                                const dbAddr = (item.enpRprFndnAddr || item.refineRoadnmAddr || "").replace(/\s+/g, "");
                                return dbAddr.includes(cleanAddr);
                            });
                            if (filteredAddr.length > 0) companyList = filteredAddr;
                        }

                        if (companyList.length > 0) {
                            const rawComp = companyList[0];
                            companyData = {
                                corpNm: rawComp.corpNm || rawCorpName,
                                ceoNm: rawComp.enpRprFndnNm || rawComp.reprNm || "정보 없음",
                                bizno: rawComp.bizno || "정보 없음",
                                crno: rawComp.crno || "정보 없음",
                                phone: rawComp.enpTlno || rawComp.telNo || "정보 없음",
                                address: rawComp.enpRprFndnAddr || rawComp.refineRoadnmAddr || "정보 없음"
                            };
                        }
                    }
                } catch (e) {
                    console.log("공공 API 조회 파싱 오류", e);
                }

                // 공공 API에서 직접 조회가 안 되거나 필드가 누락된 경우 '정보 없음'으로 안전 처리
                if (!companyData) {
                    companyData = {
                        corpNm: rawCorpName || "정보 없음",
                        ceoNm: "정보 없음",
                        bizno: "정보 없음",
                        crno: "정보 없음",
                        phone: "정보 없음",
                        address: addressQuery || "정보 없음"
                    };
                }

                let name = companyData.corpNm;
                let ceo = companyData.ceoNm;
                let bizNo = companyData.bizno;
                let corpNo = companyData.crno;
                let phone = companyData.phone;
                let address = companyData.address;

                // 2차: 국세청 사업자 상태조회 API 실시간 대사
                let bizStatus = "조회 완료";
                let badgeClass = "bg-blue-100 text-blue-700";

                if (bizNo && bizNo !== "정보 없음") {
                    try {
                        const cleanBizNo = bizNo.replace(/-/g, "");
                        const ntsUrl = `https://api.odcloud.kr/api/nts-businessman/v1/status?serviceKey=${API_KEY}`;
                        const ntsBody = { b_no: [cleanBizNo] };

                        const ntsResponse = await fetch(ntsUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "Accept": "application/json" },
                            body: JSON.stringify(ntsBody)
                        });
                        const ntsData = await ntsResponse.json();

                        if (ntsData && ntsData.data && ntsData.data.length > 0) {
                            const statusObj = ntsData.data[0];
                            bizStatus = statusObj.b_stt || "계속사업자";
                            if (bizStatus.includes("폐업")) {
                                badgeClass = "bg-red-100 text-red-700";
                            } else {
                                badgeClass = "bg-green-100 text-green-700";
                            }
                        }
                    } catch (e) {
                        console.log("국세청 대사 예외 발생", e);
                    }
                }

                // 3차: 화면 반영 (정보 없는 항목은 '정보 없음'으로 표출)
                document.getElementById('resCorpName').innerText = name;
                document.getElementById('resCeo').innerText = ceo;
                document.getElementById('resBizNo').innerText = bizNo;
                document.getElementById('resCorpNo').innerText = corpNo;
                document.getElementById('resPhone').innerText = phone;
                document.getElementById('resAddress').innerText = address;

                const badge = document.getElementById('resStatusBadge');
                badge.innerText = bizStatus;
                badge.className = `px-2.5 py-1 text-xs font-semibold rounded-full ${badgeClass}`;

                document.getElementById('resultContainer').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                document.getElementById('errorContainer').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
