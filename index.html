<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 정보 조회 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #1a365d; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2c5282; }
        .result-box { margin-top: 25px; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #edf2f7; padding-bottom: 8px; }
        .result-label { font-weight: bold; color: #718096; }
        .result-value { color: #2d3748; text-align: right; }
        .loading { text-align: center; color: #718096; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🏢 기업 정보 조회 시스템</h2>
        <div class="form-group">
            <label>상호명 *필수</label>
            <input type="text" id="corpName" placeholder="예: 세진밀레니엄에이">
        </div>
        <div class="form-group">
            <label>소재지 / 주소 (선택)</label>
            <input type="text" id="address" placeholder="예: 대전 서구">
        </div>
        <button onclick="searchCorp()">조회하기</button>
        <div class="loading" id="loading">기업 정보를 검색하고 있습니다...</div>
        
        <div class="result-box" id="resultBox">
            <div class="result-item"><span class="result-label">상호</span><span class="result-value" id="res-corpName">정보없음</span></div>
            <div class="result-item"><span class="result-label">대표자명</span><span class="result-value" id="res-ceoNm">정보없음</span></div>
            <div class="result-item"><span class="result-label">사업자등록번호</span><span class="result-value" id="res-bizno">정보없음</span></div>
            <div class="result-item"><span class="result-label">법인등록번호</span><span class="result-value" id="res-crno">정보없음</span></div>
            <div class="result-item"><span class="result-label">전화번호</span><span class="result-value" id="res-phone">정보없음</span></div>
            <div class="result-item"><span class="result-label">주소</span><span class="result-value" id="res-address">정보없음</span></div>
            <div class="result-item"><span class="result-label">사업자상태</span><span class="result-value" id="res-status">정보없음</span></div>
        </div>
    </div>

    <script>
        async function searchCorp() {
            const corpName = document.getElementById('corpName').value.trim();
            const address = document.getElementById('address').value.trim();
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');

            if (!corpName) {
                alert("상호명을 입력해 주세요.");
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                const response = await fetch(`/api/search?corpName=${encodeURIComponent(corpName)}&address=${encodeURIComponent(address)}`);
                const data = await response.json();

                document.getElementById('res-corpName').innerText = data.corpName || '정보없음';
                document.getElementById('res-ceoNm').innerText = data.ceoNm || '정보없음';
                document.getElementById('res-bizno').innerText = data.bizno || '정보없음';
                document.getElementById('res-crno').innerText = data.crno || '정보없음';
                document.getElementById('res-phone').innerText = data.phone || '정보없음';
                document.getElementById('res-address').innerText = data.address || '정보없음';
                document.getElementById('res-status').innerText = data.status || '정보없음';

                resultBox.style.display = 'block';
            } catch (error) {
                alert("조회 중 오류가 발생했습니다.");
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
