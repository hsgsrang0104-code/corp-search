<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 정보 조회 시스템</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 16px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 7px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 2px rgba(43,108,176,0.12);
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #4b6fb1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #2c5282; }
        button:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .loading {
            text-align: center;
            color: #718096;
            margin-top: 20px;
            display: none;
            font-size: 15px;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px 25px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            border-bottom: 1px solid #edf2f7;
            padding: 13px 0;
        }
        .result-label {
            font-weight: bold;
            color: #718096;
            min-width: 125px;
        }
        .result-value {
            color: #2d3748;
            text-align: right;
            word-break: break-all;
        }
        .result-count {
            color: #718096;
            font-size: 13px;
            margin-top: 12px;
            text-align: right;
        }
        .error-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 7px;
            color: #c53030;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .help-text {
            color: #718096;
            font-size: 13px;
            margin-top: 6px;
        }
        @media (max-width: 500px) {
            body { padding: 10px; }
            .container { padding: 18px; }
            .result-label { min-width: 105px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 기업 정보 조회 시스템</h2>

    <div class="form-group">
        <label for="corpName">상호명 *필수</label>
        <input type="text" id="corpName" placeholder="예: 탑안전공사" autocomplete="organization">
    </div>

    <div class="form-group">
        <label for="address">소재지 / 주소 (선택)</label>
        <input type="text" id="address" placeholder="예: 대전 서구">
        <div class="help-text">동명 기업이 여러 곳일 경우 후보를 구분하는 데 활용합니다.</div>
    </div>

    <button id="searchButton" onclick="searchCorp()">조회하기</button>

    <div class="loading" id="loading">기업 정보를 검색하고 있습니다...</div>
    <div class="error-message" id="errorMessage"></div>

    <div class="result-box" id="resultBox">
        <div class="result-item">
            <span class="result-label">상호</span>
            <span class="result-value" id="res-corpName">정보없음</span>
        </div>
        <div class="result-item">
            <span class="result-label">대표자명</span>
            <span class="result-value" id="res-ceoNm">정보없음</span>
        </div>
        <div class="result-item">
            <span class="result-label">사업자등록번호</span>
            <span class="result-value" id="res-bizno">정보없음</span>
        </div>
        <div class="result-item">
            <span class="result-label">법인등록번호</span>
            <span class="result-value" id="res-crno">정보없음</span>
        </div>
        <div class="result-item">
            <span class="result-label">전화번호</span>
            <span class="result-value" id="res-phone">정보없음</span>
        </div>
        <div class="result-item">
            <span class="result-label">주소</span>
            <span class="result-value" id="res-address">정보없음</span>
        </div>
        <div class="result-item">
            <span class="result-label">사업자상태</span>
            <span class="result-value" id="res-status">조회 전</span>
        </div>
        <div class="result-count" id="resultCount"></div>
    </div>
</div>

<script>
<script>
async function searchCorp() {
    const corpName = document.getElementById('corpName').value.trim();
    const address = document.getElementById('address').value.trim();
    const loading = document.getElementById('loading');
    const resultBox = document.getElementById('resultBox');
    const errorMessage = document.getElementById('errorMessage');
    const searchButton = document.getElementById('searchButton');

    if (!corpName) {
        alert("상호명을 입력해 주세요.");
        document.getElementById('corpName').focus();
        return;
    }

    resultBox.style.display = 'none';
    errorMessage.style.display = 'none';
    errorMessage.innerText = '';

    loading.style.display = 'block';
    searchButton.disabled = true;
    searchButton.innerText = '조회 중...';

    try {
        // [1단계] 브라우저(클라이언트)에서 직접 비즈노 API 호출 (국내 IP 활용)
        const biznoApiKey = "HhBUJ3jOITJpAxdtEcKm20SZlTBoIwdN"; // 본인의 비즈노 API 키
        const biznoUrl = `https://bizno.net/api/fapi?key=${encodeURIComponent(biznoApiKey)}&gb=3&q=${encodeURIComponent(corpName)}&type=json`;

        const biznoResponse = await fetch(biznoUrl);
        if (!biznoResponse.ok) {
            throw new Error(`비즈노 API 통신 실패 (HTTP 상태: ${biznoResponse.status})`);
        }

        const biznoData = await biznoResponse.json();
        if (biznoData.resultCode !== 0 && biznoData.resultCode !== "0") {
            throw new Error(`비즈노 검색 결과 없음: ${biznoData.resultMsg || '결과 없음'}`);
        }

        const rawItems = biznoData.items;
        let itemList = Array.isArray(rawItems) ? rawItems : (rawItems ? [rawItems] : []);

        if (itemList.length === 0) {
            throw new Error("해당 상호명으로 등록된 기업정보가 비즈노에 없습니다.");
        }

        // 주소 및 상호 매칭 함수
        function normalize(val) {
            return String(val || "").replace(/주식회사|㈜|\(주\)|주\)/g, "").replace(/\s/g, "").replace(/[()（）]/g, "").toLowerCase();
        }

        const searchName = normalize(corpName);
        const rankedItems = itemList.map(item => {
            const companyName = normalize(item.company);
            const companyAddress = item.address || item.addr || "";
            let score = 0;
            if (companyName === searchName) score += 100;
            else if (companyName.includes(searchName) || searchName.includes(companyName)) score += 50;
            if (address && companyAddress.includes(address)) score += 100;
            return { item, score };
        });

        rankedItems.sort((a, b) => b.score - a.score);
        const target = rankedItems[0].item;

        // [2단계 & 3단계] 확보한 사업자번호로 국세청 및 금융위 검증을 위해 백엔드(/api/search) 호출
        const params = new URLSearchParams({
            corpName: target.company || corpName,
            bizno: target.bno || "",
            address: target.address || target.addr || address
        });

        const verifyResponse = await fetch(`/api/search?${params.toString()}`);
        const responseText = await verifyResponse.text();

        let verifyData;
        try {
            verifyData = JSON.parse(responseText);
        } catch (e) {
            throw new Error("서버 응답이 올바른 형식이 아닙니다:\n" + responseText.substring(0, 300));
        }

        if (!verifyResponse.ok || verifyData.success === false) {
            throw new Error(verifyData.error || "추가 검증 중 오류가 발생했습니다.");
        }

        // 화면에 결과 출력
        document.getElementById('res-corpName').innerText = verifyData.corpName || '정보없음';
        document.getElementById('res-ceoNm').innerText = verifyData.ceoNm || '정보없음';
        document.getElementById('res-bizno').innerText = verifyData.bizno || '정보없음';
        document.getElementById('res-crno').innerText = verifyData.crno || '정보없음';
        document.getElementById('res-phone').innerText = verifyData.phone || '정보없음';
        document.getElementById('res-address').innerText = verifyData.address || '정보없음';
        document.getElementById('res-status').innerText = verifyData.status || '조회 결과 없음';

        document.getElementById('resultCount').innerText =
            `전체 검색 결과 ${biznoData.totalCount ?? itemList.length}건 / 반환 결과 ${itemList.length}건`;

        resultBox.style.display = 'block';

    } catch (error) {
        console.error("조회 오류:", error);
        errorMessage.innerText = "조회 중 오류가 발생했습니다.\n\n" + error.message;
        errorMessage.style.display = 'block';
    } finally {
        loading.style.display = 'none';
        searchButton.disabled = false;
        searchButton.innerText = '조회하기';
    }
}

document.getElementById('corpName').addEventListener('keydown', e => { if (e.key === 'Enter') searchCorp(); });
document.getElementById('address').addEventListener('keydown', e => { if (e.key === 'Enter') searchCorp(); });
</script>
