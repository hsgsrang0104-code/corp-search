
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 정보 조회 시스템</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            color: #1a365d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 2px rgba(43,108,176,0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #4b6fb1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2c5282;
        }

        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: #718096;
            margin-top: 20px;
            display: none;
            font-size: 15px;
        }

        .error-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 7px;
            color: #c53030;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .selection-area {
            display: none;
            margin-top: 25px;
        }

        .selection-title {
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .candidate {
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
        }

        .candidate-name {
            font-weight: bold;
            font-size: 16px;
            color: #2b6cb0;
            margin-bottom: 8px;
        }

        .candidate-info {
            font-size: 14px;
            line-height: 1.6;
            color: #4a5568;
            overflow-wrap: anywhere;
        }

        .candidate button {
            margin-top: 12px;
            padding: 11px;
            font-size: 15px;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px 25px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            border-bottom: 1px solid #edf2f7;
            padding: 14px 0;
        }

        .result-label {
            font-weight: bold;
            color: #718096;
            min-width: 115px;
            flex-shrink: 0;
        }

        .result-value {
            color: #2d3748;
            text-align: right;
            flex: 1;
            min-width: 0;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.6;
        }

        .address-value {
            text-align: left;
        }

        .address-source {
            color: #718096;
            font-size: 12px;
            margin-left: 5px;
        }

        .help-text {
            color: #718096;
            font-size: 13px;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
            }

            .result-box {
                padding: 15px;
            }

            .result-item {
                gap: 8px;
            }

            .result-label {
                min-width: 95px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🏢 기업 정보 조회 시스템</h2>

    <div class="form-group">
        <label for="corpName">상호명 *필수</label>
        <input
            type="text"
            id="corpName"
            placeholder="예: 탑안전공사"
            autocomplete="organization"
        >
    </div>

    <div class="form-group">
        <label for="address">소재지 / 주소 (선택)</label>
        <input
            type="text"
            id="address"
            placeholder="예: 대전 서구"
        >
        <div class="help-text">
            동명 기업이 여러 곳일 경우 후보를 구분하는 데 활용합니다.
        </div>
    </div>

    <button id="searchButton" type="button">조회하기</button>

    <div class="loading" id="loading">
        기업 정보를 검색하고 있습니다...
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="selection-area" id="selectionArea">
        <div class="selection-title">
            검색 결과입니다. 조회할 기업을 선택하세요.
        </div>
        <div id="candidateList"></div>
    </div>

    <div class="result-box" id="resultBox">

        <div class="result-item">
            <span class="result-label">상호</span>
            <span class="result-value" id="res-corpName">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">대표자명</span>
            <span class="result-value" id="res-ceo">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">사업자등록번호</span>
            <span class="result-value" id="res-bizno">정보없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">전화번호</span>
            <span class="result-value" id="res-phone">번호없음</span>
        </div>

        <div class="result-item">
            <span class="result-label">주소</span>
            <span class="result-value address-value">
                <span id="res-address">정보없음</span>
                <span class="address-source" id="res-addrSource"></span>
            </span>
        </div>

        <div class="result-item">
            <span class="result-label">사업자상태</span>
            <span class="result-value" id="res-status">조회 전</span>
        </div>

    </div>

</div>

<script>

const $ = id => document.getElementById(id);

function showError(message) {
    $("errorMessage").innerText = message;
    $("errorMessage").style.display = "block";
}

function setLoading(isLoading, message) {
    $("loading").style.display = isLoading ? "block" : "none";
    $("loading").innerText = message || "기업 정보를 검색하고 있습니다...";
    $("searchButton").disabled = isLoading;
    $("searchButton").innerText = isLoading ? "조회 중..." : "조회하기";
}

async function requestData(url) {
    const response = await fetch(url);
    const text = await response.text();

    let data;

    try {
        data = JSON.parse(text);
    } catch (e) {
        throw new Error("서버 응답을 읽을 수 없습니다: " + text.substring(0, 200));
    }

    if (!response.ok || data.success === false) {
        throw new Error(data.error || "정보 조회 중 오류가 발생했습니다.");
    }

    return data;
}

// 1단계: 기업명으로 비즈노 검색
async function searchCorp() {

    const corpName = $("corpName").value.trim();
    const address = $("address").value.trim();

    if (!corpName) {
        alert("상호명을 입력해 주세요.");
        $("corpName").focus();
        return;
    }

    $("resultBox").style.display = "none";
    $("selectionArea").style.display = "none";
    $("candidateList").replaceChildren();
    $("errorMessage").style.display = "none";

    setLoading(true);

    try {
        const params = new URLSearchParams({
            corpName: corpName
        });

        const data = await requestData("/api/search?" + params.toString());

        if (!data.candidates || data.candidates.length === 0) {
            throw new Error("검색된 기업이 없습니다.");
        }

        // 주소가 입력된 경우 후보 주소를 기준으로 우선순위 조정
        let candidates = [...data.candidates];

        if (address) {
            candidates.sort((a, b) => {
                const aMatch = (a.address || "").includes(address) ? 1 : 0;
                const bMatch = (b.address || "").includes(address) ? 1 : 0;
                return bMatch - aMatch;
            });
        }

        if (candidates.length === 1) {
            await selectCandidate(candidates[0], corpName);
        } else {
            showCandidates(candidates, corpName);
        }

    } catch (error) {
        showError("조회 중 오류가 발생했습니다.\n\n" + error.message);
    } finally {
        setLoading(false);
    }
}

// 2단계: 여러 기업 후보 표시
function showCandidates(candidates, corpName) {

    const list = $("candidateList");
    list.replaceChildren();

    candidates.forEach(candidate => {

        const card = document.createElement("div");
        card.className = "candidate";

        const name = document.createElement("div");
        name.className = "candidate-name";
        name.textContent = candidate.name || corpName;

        const info = document.createElement("div");
        info.className = "candidate-info";
        info.textContent =
            "주소: " + (candidate.address || "정보없음") +
            "\n대표자: " + (candidate.ceo || "정보없음") +
            "\n상태: " + (candidate.status || "정보없음");

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "이 기업 조회하기";

        button.addEventListener("click", () => {
            selectCandidate(candidate, corpName);
        });

        card.appendChild(name);
        card.appendChild(info);
        card.appendChild(button);

        list.appendChild(card);
    });

    $("selectionArea").style.display = "block";
}

// 3단계: 선택한 기업의 상세정보 조회
async function selectCandidate(candidate, originalName) {

    if (!candidate.detailUrl) {
        showError("상세 페이지 주소를 찾을 수 없습니다.");
        return;
    }

    $("selectionArea").style.display = "none";
    $("resultBox").style.display = "none";
    $("errorMessage").style.display = "none";

    setLoading(true, "선택한 기업의 상세정보를 조회하고 있습니다...");

    try {
        const params = new URLSearchParams({
            corpName: candidate.name || originalName,
            detailUrl: candidate.detailUrl
        });

        const data = await requestData("/api/search?" + params.toString());

        // 결과 표시
        $("res-corpName").textContent = data.corpName || candidate.name || originalName;
        $("res-ceo").textContent = data.ceo || "정보없음";
        $("res-bizno").textContent = data.bizno || "정보없음";
        $("res-phone").textContent = data.phone || "번호없음";
        $("res-address").textContent = data.address || "정보없음";
        $("res-status").textContent = data.status || "정보없음";

        $("res-addrSource").textContent =
            data.addressSource ? "(" + data.addressSource + " 주소)" : "";

        $("resultBox").style.display = "block";

    } catch (error) {
        showError("상세정보 조회 중 오류가 발생했습니다.\n\n" + error.message);
    } finally {
        setLoading(false);
    }
}

// 버튼 클릭
$("searchButton").addEventListener("click", searchCorp);

// 엔터키 검색
$("corpName").addEventListener("keydown", event => {
    if (event.key === "Enter") searchCorp();
});

$("address").addEventListener("keydown", event => {
    if (event.key === "Enter") searchCorp();
});

</script>

</body>
</html>
