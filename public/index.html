<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 정보 검색</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-md bg-blue-600 text-white rounded-xl p-4 shadow-md text-center mb-6">
        <h1 class="text-xl font-bold">🏢 기업 정보 검색 시스템</h1>
        <p class="text-xs text-blue-100 mt-1">상호명 및 주소 기반 핵심 정보 조회</p>
    </div>

    <div class="w-full max-w-md bg-white rounded-xl p-5 shadow-md mb-6 space-y-4">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">상호명 <span class="text-red-500">*필수</span></label>
            <input type="text" id="corpNameInput" placeholder="예: 탑안전공사" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">소재지 / 주소 <span class="text-gray-400 text-xs">(선택)</span></label>
            <input type="text" id="addressInput" placeholder="예: 대전 서구" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <button onclick="searchCompany()" id="searchBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow">
            조회하기
        </button>
    </div>

    <div id="loading" class="hidden text-center py-6">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
        <p class="text-xs text-gray-500 mt-2">기업 정보를 검색하고 있습니다...</p>
    </div>

    <!-- 결과 영역: 주소, 전화번호, 대표자 중심 -->
    <div id="resultContainer" class="w-full max-w-md bg-white rounded-xl p-5 shadow-md hidden border-l-4 border-blue-600 space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
            <h2 id="resCorpName" class="text-lg font-bold text-gray-800">기업명</h2>
            <span id="resStatusBadge" class="px-3 py-1 text-xs font-bold rounded-full bg-gray-100 text-gray-700">조회완료</span>
        </div>

        <div class="space-y-3 text-sm">
            <div class="flex justify-between items-start">
                <span class="text-gray-500 font-medium">주소</span>
                <span id="resAddress" class="font-medium text-gray-800 text-right max-w-[240px]">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500 font-medium">전화번호</span>
                <span id="resPhone" class="font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500 font-medium">대표자</span>
                <span id="resCeo" class="font-medium text-gray-800">-</span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500 font-medium">사업자등록번호</span>
                <span id="resBizNo" class="font-medium text-gray-800">-</span>
            </div>
        </div>
    </div>

    <script>
        async function searchCompany() {
            const corpName = document.getElementById('corpNameInput').value.trim();
            const address = document.getElementById('addressInput').value.trim();

            if (!corpName) {
                alert("상호명을 입력해 주세요.");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            try {
                const response = await fetch(`/api/search?corpName=${encodeURIComponent(corpName)}&address=${encodeURIComponent(address)}`);
                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || "조회 중 오류가 발생했습니다.");
                    return;
                }

                document.getElementById('resCorpName').innerText = data.corpName;
                document.getElementById('resAddress').innerText = data.address;
                document.getElementById('resPhone').innerText = data.phone;
                document.getElementById('resCeo').innerText = data.ceoNm;
                document.getElementById('resBizNo').innerText = data.bizno;

                document.getElementById('resultContainer').classList.remove('hidden');
            } catch (e) {
                alert("서버 통신 오류가 발생했습니다.");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
